# docker compose up --build  →  http://localhost:5173
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AGENT_DB_USER: ${AGENT_DB_USER}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
    volumes:
      - ./data/scripts/init_db.sh:/docker-entrypoint-initdb.d/10_init_db.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PGPORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: "5432"
    volumes:
      - ./data:/app/data
    ports:
      - "8010:8000"  # 호스트의 8000은 다른 프로그램이 쓰는 경우가 많다
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
