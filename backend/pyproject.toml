[project]
name = "ontolens-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic==0.125.0",
    "fastapi>=0.162.5",
    "langchain==0.3.30",
    "langchain-anthropic==0.3.22",
    "langchain-core==0.3.86",
    "langgraph==0.6.11",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.33",
    "rdflib>=7.6.0",
    "sqlglot==30.23.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
